spring.application.name=sandbox-spring-jpa-transaction

server.port=9090

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/employee_db
spring.datasource.username=ruben
spring.datasource.password=ruben123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# flyway
spring.flyway.enabled=true
flyway.url=jdbc:postgresql://localhost:5432/employee_db
flyway.user=ruben
flyway.password=ruben123456
flyway.schemas=public
flyway.locations=classpath:db/migration
